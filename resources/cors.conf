# Use this file to allow css/js from main craft site to be called from static pages
# Place in .ddev/nginx/
add_header Access-Control-Allow-Origin "https://sscache.<domain>.ddev.site" always;
add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
add_header Access-Control-Allow-Headers "DNT,User-Agent,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
